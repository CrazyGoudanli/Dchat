<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug Reasoning Switch</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>推理开关调试</h1>
    
    <div>
        <label>Base URL: <input type="text" id="baseUrl" value="https://api.siliconflow.cn/v1" style="width: 300px;"></label><br>
        <label>API Key: <input type="password" id="apiKey" value="sk-iywmubrerssgorsgkvphzzqlwbodogtujpaoawkyjtqmmdqp" style="width: 400px;"></label><br>
        <label>Model: <input type="text" id="model" value="kimi/k2.5" style="width: 200px;"></label><br><br>
        
        <label><input type="checkbox" id="includeReasoning"> Include Reasoning</label><br><br>
        
        <button onclick="testRequest()">测试请求</button>
        <button onclick="testStreaming()">测试流式请求</button>
    </div>
    
    <div id="logs"></div>
    
    <script>
        const logs = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }
        
        async function testRequest() {
            const baseUrl = document.getElementById('baseUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            const includeReasoning = document.getElementById('includeReasoning').checked;
            
            log(`开始测试请求...`, 'info');
            log(`模型: ${model}`, 'info');
            log(`推理开关: ${includeReasoning}`, 'info');
            
            const requestBody = {
                model: model,
                messages: [
                    { role: 'user', content: '请介绍一下你自己' }
                ],
                max_tokens: 500,
                stream: false
            };
            
            // 添加推理参数
            if (includeReasoning) {
                requestBody.reasoning = true;
                requestBody.thinking = true;
                requestBody.include_reasoning = true;
                log('添加推理参数: reasoning=true, thinking=true, include_reasoning=true', 'info');
            }
            
            log('请求体:', 'info');
            log(JSON.stringify(requestBody, null, 2), 'info');
            
            try {
                const response = await fetch(`${baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                log(`HTTP 状态码: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                log('响应数据:', 'info');
                log(JSON.stringify(data, null, 2), 'info');
                
                // 检查响应中是否有推理内容
                const hasThinking = data.choices?.[0]?.message?.thinking;
                const hasReasoning = data.choices?.[0]?.message?.reasoning;
                
                if (hasThinking || hasReasoning) {
                    log(`✅ 发现推理内容! thinking字段: ${hasThinking ? '是' : '否'}, reasoning字段: ${hasReasoning ? '是' : '否'}`, 'success');
                    if (hasThinking) {
                        log(`推理内容长度: ${hasThinking.length} 字符`, 'info');
                        log(`推理内容前200字符: ${hasThinking.substring(0, 200)}...`, 'info');
                    }
                } else {
                    log(`❌ 响应中没有推理内容`, 'error');
                }
                
            } catch (error) {
                log(`请求失败: ${error.message}`, 'error');
            }
        }
        
        async function testStreaming() {
            const baseUrl = document.getElementById('baseUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            const includeReasoning = document.getElementById('includeReasoning').checked;
            
            log(`开始测试流式请求...`, 'info');
            
            const requestBody = {
                model: model,
                messages: [
                    { role: 'user', content: '1+1等于多少？请思考后再回答。' }
                ],
                max_tokens: 500,
                stream: true
            };
            
            if (includeReasoning) {
                requestBody.reasoning = true;
                requestBody.thinking = true;
                requestBody.include_reasoning = true;
                log('添加推理参数到流式请求', 'info');
            }
            
            log('流式请求体:', 'info');
            log(JSON.stringify(requestBody, null, 2), 'info');
            
            try {
                const response = await fetch(`${baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                let thinkingContent = '';
                
                log('开始接收流式响应...', 'info');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(line => line.trim() !== '');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                log('流式响应完成', 'success');
                                continue;
                            }
                            
                            try {
                                const parsed = JSON.parse(data);
                                log(`收到数据块:`, 'info');
                                
                                // 检查是否有推理内容
                                const delta = parsed.choices?.[0]?.delta;
                                if (delta) {
                                    if (delta.content) {
                                        fullResponse += delta.content;
                                        log(`内容: ${delta.content}`, 'info');
                                    }
                                    if (delta.thinking) {
                                        thinkingContent += delta.thinking;
                                        log(`💭 推理: ${delta.thinking}`, 'success');
                                    }
                                    if (delta.reasoning) {
                                        log(`🤔 推理(reasoning字段): ${delta.reasoning}`, 'success');
                                    }
                                }
                                
                                // 检查其他可能包含推理的字段
                                if (parsed.thinking) {
                                    log(`发现thinking字段: ${parsed.thinking}`, 'success');
                                }
                                
                            } catch (e) {
                                log(`解析失败: ${e.message}, 原始数据: ${data}`, 'error');
                            }
                        }
                    }
                }
                
                log('最终响应:', 'info');
                log(`完整回答: ${fullResponse}`, 'info');
                if (thinkingContent) {
                    log(`完整推理内容: ${thinkingContent}`, 'success');
                    log(`推理内容长度: ${thinkingContent.length} 字符`, 'info');
                } else {
                    log('❌ 没有收到推理内容', 'error');
                }
                
            } catch (error) {
                log(`流式请求失败: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
